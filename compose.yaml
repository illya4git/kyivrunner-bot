# Production: one container, one volume. Runs on amd64 and arm64 (e.g. Raspberry Pi 4/5, 64-bit OS).
#   docker compose up -d --build
services:
  bot:
    build: .
    image: kyivrunner-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/bot.sqlite
    volumes:
      - bot-data:/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  bot-data:
